name: Thesis PDF Generation
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/**'

jobs:
  Compile:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7
      - name: Install SVG conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: "Install UV"
        uses: astral-sh/setup-uv@v10.3.3
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - name: Build PDF
        run: |
          uv run quarto render index.qmd
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mup-${{ github.sha }}
          path: |
            mup.pdf
            animacja.gif

